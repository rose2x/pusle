name: Build Arch Linux Package

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-arch:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Install system dependencies for Arch Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev rubygems build-essential libarchive-dev
        sudo gem install fpm
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed \
          --add-data "templates:templates" \
          --add-data "static:static" \
          --name "PulseMusic" app.py
    
    - name: Create Arch Linux package
      run: |
        mkdir -p package_root/usr/local/bin
        mkdir -p package_root/usr/share/applications
        cp dist/PulseMusic package_root/usr/local/bin/
        chmod +x package_root/usr/local/bin/PulseMusic
        
        cat <<EOF > package_root/usr/share/applications/pulsemusic.desktop
        [Desktop Entry]
        Name=Pulse Music
        Exec=/usr/local/bin/PulseMusic
        Type=Application
        Categories=AudioVideo;Audio;Player;
        Terminal=false
        EOF
        
        fpm -s dir -t pacman -n "pulsemusic" -v "1.0.0" \
          -C package_root -p PulseMusic_Linux_arch.pkg.tar.zst usr/
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PulseMusic_Arch
        path: PulseMusic_Linux_arch.pkg.tar.zst
